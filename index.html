<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoMonitor — Iluminación</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #182026;
      --surface-hover: #222d36;
      --border: #2a3742;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --alarm: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .brand p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .server-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .server-box label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .server-box input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      width: 195px;
      outline: none;
    }

    /* Main Layout */
    .dashboard {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 1.5rem;
    }

    @media (max-width: 760px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 1.1rem;
      color: var(--text);
    }

    /* Left Panel: Mode Cards */
    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .mode-btn {
      background: #13191e;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 0.85rem;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .mode-btn:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .mode-btn.alarm.active {
      border-color: var(--alarm);
      background: rgba(239, 68, 68, 0.14);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }

    .mode-icon {
      font-size: 1.45rem;
    }

    .mode-name {
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .mode-desc {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Right Panel: Custom Builder */
    .wheel-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0.25rem auto 1.25rem auto;
      touch-action: none;
    }

    #colorWheel {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      cursor: crosshair;
      display: block;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }

    #wheelCursor {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      left: 50%;
      top: 50%;
    }

    .control-group {
      margin-bottom: 1.1rem;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .control-header strong {
      color: var(--text);
    }

    /* Brightness Slider */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(to right, #111827, #ffffff);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #13191e;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      cursor: pointer;
    }

    /* Live Preview + Submit */
    .preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .swatch-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #colorPreview {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: rgb(255, 255, 255);
      transition: background 0.1s ease;
    }

    .rgb-text {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .rgb-text strong {
      display: block;
      color: var(--text);
      font-size: 0.9rem;
    }

    .btn-apply {
      background: var(--accent);
      color: #06281e;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.35rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    .btn-apply:hover {
      filter: brightness(1.1);
    }

    /* Status Toast */
    #statusBar {
      width: 100%;
      max-width: 920px;
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-ok { color: #34d399 !important; }
    .status-err { color: #f87171 !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>EcoMonitor</h1>
      <p>Control de Iluminación</p>
    </div>
    <div class="server-box">
      <label for="apiUrl">API:</label>
      <input type="text" id="apiUrl" value="http://172.20.10.8:8001" />
    </div>
  </header>

  <main class="dashboard">
    <!-- Left Column: Preset Modes -->
    <section class="panel">
      <h2 class="panel-title">Modos de Iluminación</h2>
      <div class="modes-grid">
        <button class="mode-btn alarm" data-mode="Alarma" onclick="activarPreset(this, 'Alarma', '255,0,0', 100)">
          <span class="mode-icon">🚨</span>
          <span class="mode-name">Modo Alarma</span>
          <span class="mode-desc">Emergencia rojo intenso</span>
        </button>

        <button class="mode-btn" data-mode="Nocturno" onclick="activarPreset(this, 'Nocturno', '255,255,255', 4)">
          <span class="mode-icon">🌙</span>
          <span class="mode-name">Modo Nocturno</span>
          <span class="mode-desc">Luz tenue de descanso</span>
        </button>

        <button class="mode-btn" data-mode="Show" onclick="activarPreset(this, 'Show', 'Multicolor', 100)">
          <span class="mode-icon">✨</span>
          <span class="mode-name">Modo Espectáculo</span>
          <span class="mode-desc">Secuencia multicolor</span>
        </button>

        <button class="mode-btn" data-mode="Halloween" onclick="activarPreset(this, 'Halloween', '255,80,0|140,0,255', 85)">
          <span class="mode-icon">🎃</span>
          <span class="mode-name">Modo Halloween</span>
          <span class="mode-desc">Naranja y morado</span>
        </button>

        <button class="mode-btn" data-mode="Navidad" onclick="activarPreset(this, 'Navidad', '255,0,0|0,200,40', 85)">
          <span class="mode-icon">🎄</span>
          <span class="mode-name">Modo Navidad</span>
          <span class="mode-desc">Rojo y verde festivo</span>
        </button>

        <button class="mode-btn active" id="btnPersonalizado" data-mode="Personalizado" onclick="seleccionarTarjeta(this)">
          <span class="mode-icon">🎨</span>
          <span class="mode-name">Modo Personalizado</span>
          <span class="mode-desc">Color y patrón a medida</span>
        </button>
      </div>
    </section>

    <!-- Right Column: Interactive HSV Wheel & Custom Controls -->
    <section class="panel">
      <h2 class="panel-title">Modo Personalizado</h2>

      <div class="wheel-wrapper" id="wheelWrapper">
        <canvas id="colorWheel" width="230" height="230"></canvas>
        <div id="wheelCursor"></div>
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Brillo</span>
          <strong id="brilloLabel">80%</strong>
        </div>
        <input type="range" id="brilloSlider" min="1" max="100" value="80" />
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Patrón</span>
        </div>
        <select id="patronSelect">
          <option value="Solido">Color Sólido</option>
          <option value="Parpadeo">Parpadeo</option>
          <option value="Onda">Onda / Barrido</option>
          <option value="Respiracion">Respiración</option>
        </select>
      </div>

      <div class="preview-bar">
        <div class="swatch-info">
          <div id="colorPreview"></div>
          <div class="rgb-text">
            <strong id="rgbDisplay">RGB(255, 255, 255)</strong>
            <span id="hsvDisplay">H: 0° · S: 0% · B: 80%</span>
          </div>
        </div>
        <button class="btn-apply" onclick="aplicarPersonalizado()">Aplicar</button>
      </div>
    </section>
  </main>

  <div id="statusBar">
    <span id="statusText">Listo. Selecciona un modo o personaliza el color.</span>
    <span id="lastSent"></span>
  </div>

  <script>
    const canvas = document.getElementById('colorWheel');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('wheelCursor');
    const brilloSlider = document.getElementById('brilloSlider');
    const brilloLabel = document.getElementById('brilloLabel');
    const colorPreview = document.getElementById('colorPreview');
    const rgbDisplay = document.getElementById('rgbDisplay');
    const hsvDisplay = document.getElementById('hsvDisplay');

    let currentHue = 0;   // 0 - 360
    let currentSat = 0;   // 0 - 1
    let currentVal = 0.8; // 0 - 1 (brightness)
    let isDragging = false;

    // 1. Draw HSV Color Wheel onto Canvas
    function drawColorWheel() {
      const radius = canvas.width / 2;
      const image = ctx.createImageData(canvas.width, canvas.height);
      const data = image.data;

      for (let y = -radius; y < radius; y++) {
        for (let x = -radius; x < radius; x++) {
          const dist = Math.sqrt(x * x + y * y);
          const idx = ((y + radius) * canvas.width + (x + radius)) * 4;

          if (dist <= radius) {
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            const sat = dist / radius;
            const [r, g, b] = hsvToRgb(angle, sat, 1);
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = 255;
          } else {
            data[idx + 3] = 0;
          }
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    // 2. HSV (h: 0-360, s: 0-1, v: 0-1) -> RGB (0-255)
    function hsvToRgb(h, s, v) {
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r1 = 0, g1 = 0, b1 = 0;

      if (h < 60)      { r1 = c; g1 = x; b1 = 0; }
      else if (h < 120){ r1 = x; g1 = c; b1 = 0; }
      else if (h < 180){ r1 = 0; g1 = c; b1 = x; }
      else if (h < 240){ r1 = 0; g1 = x; b1 = c; }
      else if (h < 300){ r1 = x; g1 = 0; b1 = c; }
      else             { r1 = c; g1 = 0; b1 = x; }

      return [
        Math.round((r1 + m) * 255),
        Math.round((g1 + m) * 255),
        Math.round((b1 + m) * 255)
      ];
    }

    // 3. Handle Wheel Pointer Interaction
    function pickFromWheel(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const radius = rect.width / 2;
      let dx = clientX - (rect.left + radius);
      let dy = clientY - (rect.top + radius);
      let dist = Math.sqrt(dx * dx + dy * dy);

      // Clamp cursor inside circle edge
      if (dist > radius) {
        dx = (dx / dist) * radius;
        dy = (dy / dist) * radius;
        dist = radius;
      }

      let angle = Math.atan2(dy, dx) * (180 / Math.PI);
      if (angle < 0) angle += 360;

      currentHue = Math.round(angle);
      currentSat = dist / radius;

      cursor.style.left = `${radius + dx}px`;
      cursor.style.top = `${radius + dy}px`;

      seleccionarTarjeta(document.getElementById('btnPersonalizado'));
      updateColorUI();
    }

    function updateColorUI() {
      const pct = parseInt(brilloSlider.value);
      currentVal = pct / 100;
      brilloLabel.textContent = `${pct}%`;

      // Pure hue+sat preview scaled visually by brightness
      const [r, g, b] = hsvToRgb(currentHue, currentSat, Math.max(0.15, currentVal));
      const [rawR, rawG, rawB] = hsvToRgb(currentHue, currentSat, 1);

      colorPreview.style.background = `rgb(${r}, ${g}, ${b})`;
      rgbDisplay.textContent = `RGB(${rawR}, ${rawG}, ${rawB})`;
      hsvDisplay.textContent = `H: ${currentHue}° · S: ${Math.round(currentSat * 100)}% · B: ${pct}%`;
    }

    // Mouse & Touch Events for Wheel
    canvas.addEventListener('mousedown', (e) => { isDragging = true; pickFromWheel(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => { if (isDragging) pickFromWheel(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('touchstart', (e) => {
      isDragging = true;
      const t = e.touches[0];
      pickFromWheel(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const t = e.touches[0];
      pickFromWheel(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });

    brilloSlider.addEventListener('input', updateColorUI);

    // 4. UI Mode Selection & API Calls
    function seleccionarTarjeta(btn) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function activarPreset(btn, modo, color, brillo_pct) {
      seleccionarTarjeta(btn);
      enviarComando(modo, color, brillo_pct);
    }

    function aplicarPersonalizado() {
      seleccionarTarjeta(document.getElementById('btnPersonalizado'));
      const patron = document.getElementById('patronSelect').value;
      const pct = parseInt(brilloSlider.value);
      const [r, g, b] = hsvToRgb(currentHue, currentSat, 1);
      enviarComando(patron, `${r},${g},${b}`, pct);
    }

    async function enviarComando(modo, color, brillo_pct) {
      const baseUrl = document.getElementById('apiUrl').value.trim();
      const statusText = document.getElementById('statusText');
      const lastSent = document.getElementById('lastSent');

      statusText.className = '';
      statusText.textContent = `Enviando "${modo}"...`;

      try {
        const res = await fetch(`${baseUrl}/comando_web`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            modo: modo,
            color: color,
            brillo_pct: parseInt(brillo_pct)
          })
        });

        if (res.ok) {
          statusText.className = 'status-ok';
          statusText.textContent = `✓ Activo: ${modo} · Color: ${color} · Brillo: ${brillo_pct}%`;
          lastSent.textContent = new Date().toLocaleTimeString();
        } else {
          statusText.className = 'status-err';
          statusText.textContent = `Error HTTP ${res.status} al guardar en la base de datos.`;
        }
      } catch (err) {
        statusText.className = 'status-err';
        statusText.textContent = 'Sin conexión con Flask (verifica la IP, CORS o HTTPS/HTTP).';
      }
    }

    // Initialize
    drawColorWheel();
    updateColorUI();
  </script>
</body>
</html>
